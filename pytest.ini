[pytest]
testpaths = tests
addopts = -ra --strict-markers
# `-ra` obliga a que los saltos y los fallos salgan en el resumen. Una prueba
# que se salta en silencio es una prueba que un dia deja de correr sin que
# nadie se entere, y aqui hay pruebas de seguridad.

# La raiz del repositorio, en la ruta de importacion.
#
# Sin esto, `from guardian import ...` solo funciona si se lanza
# `python -m pytest`, porque el `-m` mete el directorio actual en `sys.path`.
# Con `pytest` a secas —que es como lo ejecuta el CI, y como lo escribe el
# README— la importacion falla.
#
# Estuvo roto desde el principio y no se vio porque en la maquina de
# desarrollo siempre se lanzo con `-m`. Lo destapo la PRIMERA ejecucion del
# CI, que es exactamente para lo que sirve tener uno: la maquina limpia no
# comparte las costumbres de la maquina de quien escribe.
pythonpath = .
