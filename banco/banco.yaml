      Verificado el 2026-08-02: set_config tiene 1 sobrecarga y esta revocada.

  - id: M-17
    bloque: C2p
    via: SQL
    entrada: "SET default_transaction_read_only TO off; DELETE FROM pagos"
    intenta: "Desactivar la capa 1 y escribir, en dos sentencias"
    capa: "S1 + S5 · privilegios y modo del driver sin multi-sentencia"
    regla_esperada: S1
    desenlace: rechazo
    criterio: >
      Con la capa 3 apagada, el SET puede prosperar pero el DELETE muere por
