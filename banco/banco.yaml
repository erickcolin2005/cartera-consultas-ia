    bloque: C2p
    via: SQL
    entrada: "SELECT query_to_xml('SELECT * FROM cartera.propietarios', true, false, '')"
    intenta: "Pasar SQL como literal de texto. El analizador ve una cadena, no un subarbol: atraviesa S2, S3 y la reserializacion de ADR-12 intacto"
