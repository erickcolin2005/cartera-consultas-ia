    bloque: C2p
    via: SQL
    entrada: "SELECT pg_get_viewdef('consulta.cuotas'::regclass, true)"
    intenta: "Obtener el mapa de las tablas base sin nombrar ninguna relacion prohibida. La definicion de la vista revela cartera.*"
