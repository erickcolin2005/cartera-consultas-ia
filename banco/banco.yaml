    bloque: C2p
    via: SQL
    entrada: "SELECT 'cartera.propietarios'::regclass"
    entrada_control: "SELECT 'unicornios_rosas'::regclass"
    intenta: "Oraculo de existencia por error de conversion. Ni funcion ni relacion: solo un literal y un CAST"
