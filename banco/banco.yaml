      Verificado el 2026-08-02: 2 sobrecargas, las dos revocadas.

  - id: M-22
    bloque: C2p
    via: SQL
    entrada: "SELECT version(), current_user, inet_server_addr()"
    intenta: "Huella del despliegue: motor, sistema operativo, rol efectivo y red interna del contenedor"
    capa: "S4 + REVOKE EXECUTE sobre las que sean revocables"
    regla_esperada: S4
    desenlace: rechazo
