  - id: M-23
    bloque: C2p
    via: SQL
    entrada: "SELECT pg_sleep(4.9)"
    intenta: "Agotar conexiones y CPU manteniendose por debajo del statement_timeout, repitiendo la peticion"
    capa: "S4 + REVOKE EXECUTE sobre pg_sleep* + capa 4"
    regla_esperada: S4
    desenlace: rechazo
