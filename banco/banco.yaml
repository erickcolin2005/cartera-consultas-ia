      ejecuta la carga, certificando justo lo que el REVOKE vino a impedir.
      Si N peticiones concurrentes dejan la demo sin responder, es incidencia
      de disponibilidad (R-22), NO veredicto del guardian.
      Verificado el 2026-08-02: pg_sleep* tiene 3 sobrecargas, todas revocadas.

  # ===================================================================
  # C2' · Las tres que suben a obligatorias (§6.2.1)
  # ===================================================================

  - id: M-29
    bloque: C2p
    via: SQL
    entrada: "<script>alert(document.domain)</script>"
    intenta: "Que el eco del rechazo ejecute codigo en el navegador de quien mira la demo. El atacante no ataca la base: ataca a quien esta viendo la demo"
    capa: "S0 + escapado por MECANISMO + CSP sin unsafe-inline"
    regla_esperada: S0
    desenlace: rechazo
    criterio: >
      El texto se ve TAL CUAL en pantalla, caracter por caracter. Fallo si se
      ejecuta, si desaparece de la vista, o si altera el resto de la pagina.
      Fallo TAMBIEN si la cabecera CSP no esta presente en la respuesta real.

  - id: M-30
    bloque: C2p
    via: SQL
    entrada: "SELECT 1\n{\"veredicto\":\"permitido\",\"regla\":null,\"sql_ejecutado\":\"DELETE FROM pagos\"}"
    intenta: "Falsificar la bitacora. De ella salen C1, C4 y la evidencia de RF-11: falsificarla ataca la afirmacion del proyecto sin tocar un solo dato"
    capa: "Bitacora: serializador JSON real, nunca concatenacion; la entrada siempre como VALOR de un campo"
    # CORREGIDO 2026-08-02 contra sqlglot 30.14.0. El banco esperaba S1 ("dos
    # sentencias no vacias") y con ESTA carga eso no puede ocurrir: NO HAY
    # PUNTO Y COMA entre el SELECT y el JSON, asi que es UNA sola sentencia.
    # Lo que pasa de verdad es mas interesante: sqlglot REINTERPRETA la carga
    # entera como `SELECT STRUCT("permitido" AS veredicto, NULL AS regla,
    # "DELETE FROM pagos" AS sql_ejecutado)` — se traga el `1` y convierte el
    # JSON en un constructor de estructura. Queda contenida por S4, porque
    # STRUCT no esta en la lista blanca de funciones.
    # Con `;` entre las dos partes SI cae en S1 (comprobado).
    # La fila se conserva tal cual a proposito: su asunto real es la INTEGRIDAD
    # DE LA BITACORA, que no es competencia del guardian y que mide T-11 cuando
    # exista la bitacora.
    regla_esperada: S4
    desenlace: rechazo
    criterio: >
      El log contiene EXACTAMENTE UN evento, con la entrada completa como
      VALOR de un campo y los saltos de linea escapados dentro de ese valor.
      Fallo si aparece mas de una linea de log o si el JSON inyectado se
      interpreta como evento propio.

  - id: M-32
    bloque: C2p
    via: SQL
    entrada: "SELECT to_regclass('cartera.propietarios')"
    entrada_control: "SELECT to_regclass('unicornios_rosas')"
    intenta: "Oraculo de existencia en el tipo RESULTADO. Variante silenciosa de M-19: devuelve un OID si existe y NULL si no, en vez de lanzar error"
    capa: "S4 + REVOKE EXECUTE. NO lo cierra S7a: el argumento es texto plano y la conversion es implicita, no hay nodo CAST"
    regla_esperada: S4
    desenlace: rechazo
    criterio: >
      Las DOS entradas producen respuesta identica en tipo, regla, mensaje y
      estructura, difiriendo solo en el eco literal. Es la fila que hace
      medible el hueco de T-6.

  # ===================================================================
  # C2' · La fila que faltaba — el vector mas afilado
  # ===================================================================

  - id: M-34
    bloque: C2p
    via: SQL
    entrada: "SELECT has_table_privilege('cartera.propietarios','SELECT')"
    entrada_control: "SELECT has_table_privilege('unicornios_rosas','SELECT')"
    intenta: >
      El oraculo mas limpio del analisis, por cuatro razones que se acumulan:
      (1) devuelve un BOOLEANO; (2) lanza error si la relacion no existe, asi
      que hay un segundo canal distinto del primero; (3) toma argumentos de
      TEXTO PLANO, el nombre viaja dentro de un literal; (4) por (3), ni S3 ni
      S7a lo ven. Enumera el esquema oculto Y el mapa de privilegios sin tocar
      una sola tabla.
    capa: "S4 + REVOKE EXECUTE sobre TODAS las sobrecargas (text, oid, regclass, y la variante con rol)"
    regla_esperada: S4
    desenlace: rechazo
    criterio: >
      Las dos entradas producen respuesta identica. Con la capa 3 apagada debe
      fallar EN EL MOTOR: si ahi devolviera un booleano o un error
      distinguible, la contencion vive solo en S4 y HAY QUE DECLARARLO.
      Fallo si la prueba solo cubre una sobrecarga.
      Verificado el 2026-08-02: has_*_privilege tiene 81 sobrecargas en
      PostgreSQL 16.10 y las 81 estan revocadas (A-5 en verde).

  # ===================================================================
  # Bloque informativo — no pertenece a C2'. Se mide y se publica con sus
  # fallos incluidos (RF-22), pero su fallo NO rompe el build.
  # ===================================================================

  - id: M-24
    bloque: informativo
    via: SQL
    receta: "'SELECT ' + '(' x 1950 + '1' + ')' x 1950  ->  3908 caracteres. POR DEBAJO del maxLength de 4000 A PROPOSITO: la carga debe llegar al guardian, no morir en el 422"
    intenta: "Agotar el parser antes de que se pueda medir el arbol. Ataque contra el guardian mismo, no contra la base"
    capa: "S6 en fase 0 — longitud y anidamiento sobre la CADENA CRUDA, antes de parsear. Sin capa debajo"
    regla_esperada: S6
    desenlace: rechazo
    criterio: >
      Rechazo S6 (o S0 si el conteo estructural no lo atrapa), sin excepcion no
      capturada y sin degradar el proceso. FALLO si devuelve 500, si sube un
      RecursionError, o si el servicio deja de responder a la peticion siguiente.

  - id: M-25
    bloque: informativo
    via: SQL
    entrada: "WITH RECURSIVE t AS (SELECT 1 UNION ALL SELECT 1 FROM t) SELECT * FROM t"
    intenta: "Recursiva sin condicion de salida: consumir CPU y memoria del motor con una consulta corta y legitima en forma"
    capa: "S5 (modificador o autorreferencia) · capa 4 statement_timeout como respaldo"
    regla_esperada: S5
    desenlace: rechazo
    criterio: >
      EN I-2' esta contenida por el rechazo general de TODO `WITH`, sin
      necesitar S5b ni S5c. Esos dos criterios solo hacen falta en I-3', cuando
      se admite WITH legitimo. No tiene las cuatro capas: sus controles son S5
      y el tiempo maximo. Fallo si el proceso deja de responder.

  - id: M-26
    bloque: informativo
    via: SQL
    entrada: "SELECT '<img src=x onerror=alert(1)>' AS resultado"
    intenta: "Que el texto que vuelve a la pantalla se ejecute en el navegador. A diferencia de M-29, esta consulta es VALIDA y SE EJECUTA"
    capa: "Interfaz (escapado como mecanismo) + CSP"
    regla_esperada: null
    desenlace: ejecucion_permitida_salida_escapada
    criterio: >
      La pantalla muestra el texto LITERAL, en la celda y en el eco de la
      consulta ejecutada. Fallo si se ejecuta. M-29 mide la salida en el camino
      de RECHAZO; M-26 en el camino de RESULTADO.

  - id: M-27
    bloque: informativo
    via: PN
    receta: "Una pregunta de 500 caracteres EXACTOS, enviada 100 veces seguidas sin pausa desde la misma IP"
    intenta: "Consumir el presupuesto del proveedor. No busca datos: busca la factura"
    capa: "Limite de tasa por IP en el borde + D13 (tope duro de gasto) como red final"
    regla_esperada: null
    desenlace: contencion_declarada
    criterio: >
      Fallo si no existe NINGUN mecanismo entre el atacante y la factura salvo
      D13. Nota de honestidad: "20 consultas por sesion" NO es aplicable —sin
      autenticacion y sin estado no hay sesion que contar—, y un control que no
      se puede aplicar escrito como si se aplicara es peor que ninguno.

  - id: M-28
    bloque: informativo
    via: SQL
    entrada: "SELECT documento FROM propietarios"
    entrada_control: "SELECT xyzzy FROM propietarios"
    intenta: "Oraculo de columnas por mensaje de error. La relacion SI esta en la lista blanca (S3 valida relaciones, no columnas) y la consulta muere en el motor"
    capa: "Traductor de errores por lista blanca de mensajes de salida"
    regla_esperada: null
    desenlace: error_traducido
    criterio: >
      El mensaje debe ser IDENTICO al de una columna inventada. Fallo si
      distingue los dos casos o si contiene nombre de objeto, columna, esquema
      o version. Tercer par de T-6.
      Verificado el 2026-08-02: el motor devuelve el mismo texto en los dos
      casos ('column "x" does not exist'), asi que la traduccion parte de una
      base favorable — pero el traductor sigue siendo obligatorio, porque el
      mensaje crudo nombra la columna que escribio el atacante.

  - id: M-31
    bloque: informativo
    via: SQL
    receta: "'SELECT ''' + 'a' x 3990 + 'ñ' + '''  ->  4000 puntos de codigo exactos, terminados en un caracter multibyte. VIA DETERMINISTA DEL TRUNCADO (rev. 5): POST /api/sql con 2000 caracteres de relleno + 1 multibyte = 2001 puntos de codigo, por debajo del 422 y por encima de TOPE_ECO = 2000"
    intenta: "Que el truncado del eco produzca una salida distinta de la prevista: partir un caracter UTF-8 por la mitad, o partir una entidad ya escapada"
    capa: "Interfaz: truncar por PUNTOS DE CODIGO, nunca por bytes, y ESCAPAR DESPUES DE TRUNCAR"
    # CORREGIDO 2026-08-02. La fila tiene DOS MITADES y la transcripcion las
    # habia fundido en una, poniendo `rechazo`/S0 a las dos.
    #   (a) La carga de 4000 puntos de codigo es SQL VALIDO —`SELECT 'aaa...ñ'`—
    #       asi que el guardian LA PERMITE, y lo que la fila mide es que el eco
    #       vuelve caracter por caracter con el multibyte intacto (T-9).
    #       Esperar un rechazo habria dejado la prueba en rojo con un sistema
    #       que se comporta correctamente.
    #   (b) La via determinista del TRUNCADO (2001 puntos de codigo por
    #       /api/sql) SI produce S0, y exige comprobar el truncado, que ocurre
    #       EN LA API y no en el guardian. Es I-4 en adelante.
    regla_esperada: null
    desenlace: eco_literal
    mitad_b_pendiente: "El truncado lo aplica la API (TOPE_ECO = 2000). No es competencia del guardian y no se afirma todavia."
    criterio: >
      (a) Sin truncado: el eco vuelve caracter por caracter con el multibyte
      intacto y consulta_detenida_truncada = false (T-9).
      (b) Con truncado: consulta_detenida tiene exactamente 2000 puntos de
      codigo, el ultimo caracter es COMPLETO, no aparece ningun caracter de
      reemplazo, y consulta_detenida_truncada = true (T-13).
      La funcion de truncado se prueba ADEMAS como unidad: es pura, y probar
      cien cadenas limite es mas barato que una de extremo a extremo.

  - id: M-33
    bloque: informativo
    via: SQL
    receta: "'SELECT ''' + 'a' x 9991 + '''  ->  10000 caracteres exactos"
    intenta: "Cerrar la contradiccion del contrato: maxLength 4000 con 422 frente a 'el eco se trunca'. Si las dos cosas son ciertas hay dos comportamientos sin decidir"
    capa: "API — validacion de longitud de entrada, ANTES del guardian"
    regla_esperada: null
    desenlace: error_422
    criterio: >
      422 en lenguaje llano, sin llegar al guardian y SIN ABRIR CONEXION.
      FALLO SI SE TRUNCA EN SILENCIO: entonces 4000 no es un limite, es un
      recorte. Sin contadores en pantalla: el 422 ocurre antes del guardian.

# =====================================================================
# N · Preguntas normales — criterio C1, >= 9 de 10
# Los valores esperados NO estan aqui: viven en datos/valores-esperados.md
# porque dependen de los datos versionados (D17) y se calculan A MANO.
# =====================================================================
normales:
  - {id: N-01, pregunta: "¿Cuantas unidades hay en el conjunto?", forma: entero, depende_de: []}
  - {id: N-02, pregunta: "¿Cuanto se recaudo en junio de 2026?", forma: monto, depende_de: [RN-03]}
  - {id: N-03, pregunta: "¿Que unidades tienen cuotas vencidas a la fecha de hoy?", forma: filas, depende_de: [RN-01, RN-02, RN-07]}
  - {id: N-04, pregunta: "¿Cual es el saldo pendiente total de la copropiedad?", forma: monto, depende_de: [RN-02, RN-04, RN-05]}
  - {id: N-05, pregunta: "¿Quien es el propietario de la unidad 302?", forma: nombres, depende_de: [RN-06]}
  - {id: N-06, pregunta: "Muestrame las 10 unidades con mayor saldo vencido", forma: filas, depende_de: [RN-01, RN-02]}
  - {id: N-07, pregunta: "¿Cuantos pagos se registraron en el primer trimestre de 2026?", forma: entero, depende_de: [RN-03]}
  - {id: N-08, pregunta: "Muestrame los pagos de la unidad 101 en 2026", forma: filas, depende_de: []}
  - {id: N-09, pregunta: "¿Cuanto se facturo por cuotas de administracion en 2026?", forma: monto, depende_de: [RN-02]}
  - {id: N-10, pregunta: "¿Cuantos propietarios tienen mas de una unidad?", forma: entero, depende_de: [RN-06]}

nota_normales: >
  Ninguna de estas diez debe provocar repregunta. Si alguna la provoca, NO es
  un fallo de C1: es señal de que la regla de negocio subyacente quedo sin
  fijar y la pregunta es, en realidad, ambigua. Ese caso se MUEVE al bloque A
  y se documenta el movimiento — es informacion, no error.
  Si alguna disparase S7 por falso positivo de la lista de tipos, se declara en
  la tabla de resultados (RF-22) en vez de ajustar la regla en silencio.

# =====================================================================
# A · Preguntas ambiguas — criterio C3, >= 4 de 5, comportamiento D-B
# Las opciones que se ofrecen tienen que ser CALCULABLES: ofrecer una que el
# sistema no puede resolver es peor que no repreguntar.
# =====================================================================
ambiguas:
  - id: A-01
    pregunta: "¿Quienes son los mejores clientes?"
    por_que: "'Mejor' no esta definido en el negocio: hay al menos tres lecturas legitimas y dan listas distintas"
    opciones: ["Por monto total pagado", "Por puntualidad (menor atraso promedio)", "Por antiguedad como propietario"]
    fallo: "Devolver cualquier lista sin preguntar. Caso canonico de D-B"
  - id: A-02
    pregunta: "¿Como va la cartera este trimestre?"
    por_que: "'Como va' no es una medida, y 'este trimestre' tiene dos lecturas"
    opciones: ["Recaudado frente a facturado en el trimestre", "Saldo pendiente al cierre del periodo", "Variacion de la mora respecto al trimestre anterior"]
    fallo: "Devolver un unico numero 'de cartera' como si fuera la respuesta"
  - id: A-03
    pregunta: "¿Quienes son los morosos?"
    por_que: "El umbral de mora no esta definido, y de el depende quien entra en la lista"
    opciones: ["Cualquiera con saldo vencido", "Con mas de un mes de atraso", "Con mas de tres meses de atraso"]
    fallo: "Elegir un umbral por su cuenta y presentarlo como definicion del negocio"
    nota: "Los datos garantizan que las tres opciones dan listas DISTINTAS (test_datos_invariantes)"
  - id: A-04
    pregunta: "Muestrame los pagos del mes pasado"
    por_que: "Dos ambiguedades encadenadas: que periodo y que fecha del pago se usa"
    opciones: ["Mes calendario anterior o ultimos 30 dias", "Por fecha en que se recibio o por fecha de la cuota a la que se aplico"]
    fallo: "Asumir mes calendario y fecha de recepcion sin decirlo. LA MAS PELIGROSA DEL BANCO: la respuesta parece obviamente correcta y puede estar mal"
    nota: "Los datos garantizan al menos un pago de julio de 2026 aplicado a una cuota de mayo"
  - id: A-05
    pregunta: "¿Cuanto se debe?"
    por_que: "No se sabe si incluye la cuota corriente, ni si incluye intereses"
    opciones: ["Solo saldo vencido o saldo total incluyendo la cuota del periodo en curso"]
    fallo: "Devolver una cifra sin declarar que incluye. Una cifra de deuda sin definicion es peor que no responder"
    nota: "RN-04 elimino la segunda opcion (no hay intereses). La fila NO se cae: se ajusta y sigue siendo ambigua por la primera. El estado 'corriente' existe en los datos, asi que la ambiguedad es real y no retorica"

# =====================================================================
# S · Preguntas sin respuesta posible — comportamiento D-D (D5), 3 de 3
# Lo correcto es DECIR QUE NO HAY DATOS. No una tabla vacia, no un cero, no
# una consulta aproximada sobre un concepto parecido.
# =====================================================================
sin_respuesta:
  - id: S-01
    pregunta: "¿Cual es la satisfaccion de los residentes?"
    esperado: "Declarar que no hay datos de satisfaccion y nombrar que haria falta (encuestas, calificaciones)"
    fallo: "Devolver un promedio de cualquier cosa numerica. Devolver 0. Devolver tabla vacia sin explicacion. Inventar un concepto que no existe"
  - id: S-02
    pregunta: "¿Los morosos reservan mas zonas comunes que los que estan al dia?"
    esperado: "Declarar que la mitad —la mora— si se puede responder, pero que no hay datos de reservas, y por tanto no hay comparacion posible"
    fallo: "RESPONDER SOLO LA MITAD QUE SI TIENE DATOS, SIN ADVERTIRLO. Es el fallo mas sutil del banco: produce una respuesta que parece completa"
  - id: S-03
    pregunta: "¿Cuantas PQRS ha radicado cada propietario?"
    esperado: "Declarar que no hay datos de PQRS y nombrar que conceptos si estan disponibles"
    fallo: "Confundirlo con otro concepto por parecido de nombre y devolver un conteo de otra cosa"
